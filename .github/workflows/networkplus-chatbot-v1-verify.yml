name: Network+ Chatbot V1 Verify

on:
  push:
    branches:
      - feature/networkplus-chatbot-v1
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run verify:chatbot
